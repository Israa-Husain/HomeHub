spring.application.name=booking-service
server.port=${SERVER_PORT:8082}

homehub.seed.enabled=false
homehub.cache.enabled=false

#Use the same HomeHub PostgreSQL database as Auth.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

#Validate existing tables without creating or changing them
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.flyway.enabled=false
spring.sql.init.mode=never

#Allow a coordinator connection alongside worker connections.
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=10000

#Use the same JWT signing secret as Auth.
jwt-secret=${JWT_SECRET}

#Auth service communication
homehub.auth-url=${AUTH_SERVICE_URL:http://localhost:8081}
homehub.internal-key=${INTERNAL_API_KEY}

#OpenFeign timeouts
spring.cloud.openfeign.client.config.auth-service.connectTimeout=3000
spring.cloud.openfeign.client.config.auth-service.readTimeout=5000

#Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

#Reliable producer settings
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.request.timeout.ms=10000
spring.kafka.producer.properties.delivery.timeout.ms=30000
spring.kafka.producer.properties.max.block.ms=10000

#Shared notification event contract and transactional outbox
homehub.events.topic=homehub.notifications.v1
homehub.outbox.delay-ms=2000

#Booking rules
homehub.booking.normal-notice-hours=24
homehub.booking.emergency-notice-hours=1
homehub.booking.reschedule-notice-hours=24
homehub.booking.response-deadline-hours=24
homehub.booking.report-deadline-hours=24
homehub.booking.cancellation-notice-hours=24
homehub.booking.waitlist-offer-minutes=15
homehub.booking.emergency-surcharge=0.20

#Scheduled jobs
homehub.scheduling.enabled=${SCHEDULING_ENABLED:true}
spring.task.scheduling.pool.size=2
homehub.jobs.expiry-ms=60000
homehub.jobs.reminder-ms=60000
homehub.jobs.report-ms=3600000
homehub.jobs.waitlist-ms=60000

#Apache Ignite
homehub.cache.address=${IGNITE_ADDRESS:localhost:10800}

#Frontend access
homehub.cors.origins=${CORS_ORIGINS:http://localhost:5173}

#Optional fixtures use existing verified Auth accounts and never create users.
homehub.seed.homeowner-email=${SEED_HOMEOWNER_EMAIL:}
homehub.seed.second-homeowner-email=${SEED_SECOND_HOMEOWNER_EMAIL:}
homehub.seed.provider-email=${SEED_PROVIDER_EMAIL:}

#API documentation
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

#Health endpoint
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

#Safe error responses
server.error.include-stacktrace=never
server.error.include-exception=false
server.error.include-message=never
server.error.include-binding-errors=never

#Logging
logging.level.root=INFO
logging.level.com.ga.HomeHub.booking=INFO
logging.pattern.level=%5p [requestId:%X{requestId}]