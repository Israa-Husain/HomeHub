spring.application.name=auth-service
server.port=8081

#Connect to your existing HomeHub database.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

#Preserve existing tables.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=false
spring.sql.init.mode=never

server.error.include-stacktrace=never
server.error.include-message=never

jwt-secret=${JWT_SECRET}
jwt-expiration-ms=3600000
app.base-url=http://localhost:8081
homehub.internal-key=${INTERNAL_API_KEY}

#Seed and demo account creation are disabled by default.
homehub.seed.enabled=false
homehub.demo.enabled=false

#Local profile images, no AWS credentials required.
homehub.storage.bucket=
homehub.storage.public-base=
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

#Kafka running locally.
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.delivery.timeout.ms=30000
spring.kafka.producer.properties.request.timeout.ms=10000
homehub.events.topic=homehub.notifications.v1