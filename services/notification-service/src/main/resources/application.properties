spring.application.name=notification-service
server.port=${SERVER_PORT:8083}

#Same existing HomeHub database as Auth and Booking.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.schema=public
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=10000

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.sql.init.mode=never
spring.flyway.enabled=false

#JWT signature interpretation and secret must match Auth.
jwt-secret=${JWT_SECRET}
homehub.auth-url=${AUTH_SERVICE_URL:http://localhost:8081}
spring.cloud.openfeign.client.config.auth-service.connectTimeout=3000
spring.cloud.openfeign.client.config.auth-service.readTimeout=5000

#Same topic and schemaVersion=1 payload as both producer outboxes.
homehub.events.topic=homehub.notifications.v1
homehub.events.dlt=homehub.notifications.v1.DLT
homehub.events.partitions=3
homehub.events.replicas=${KAFKA_REPLICATION_FACTOR:1}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:19093}
spring.kafka.consumer.group-id=homehub-notification-v1
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.max-poll-records=10

spring.kafka.listener.ack-mode=record
spring.kafka.listener.concurrency=${KAFKA_CONCURRENCY:3}
spring.kafka.listener.missing-topics-fatal=true
spring.kafka.listener.log-container-config=false

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.request.timeout.ms=10000
spring.kafka.producer.properties.delivery.timeout.ms=30000
spring.kafka.producer.properties.max.block.ms=10000

#False never pretends an email was sent: failed email events retry, then remain in DLT.
homehub.mail.enabled=${MAIL_ENABLED:false}
homehub.mail.from=${MAIL_FROM:no-reply@homehub.example}

spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_TLS_REQUIRED:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

#Database polling supports SSE sessions connected to different Notification instances.
homehub.sse.poll-ms=5000
homehub.sse.max-per-user=5
spring.task.scheduling.pool.size=2
homehub.cors.origins=${CORS_ORIGINS:http://localhost:5173}

#Seeding is off by default and uses existing verified accounts without creating users or sending emails.
homehub.seed.enabled=${NOTIFICATION_SEED_ENABLED:false}
homehub.seed.emails=${NOTIFICATION_SEED_EMAILS:}

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.health.mail.enabled=${homehub.mail.enabled}

server.error.include-stacktrace=never
server.error.include-exception=false
server.error.include-message=never
server.error.include-binding-errors=never

server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

logging.level.root=INFO
logging.level.com.ga.HomeHub.notification=INFO
logging.pattern.level=%5p [requestId:%X{requestId}]