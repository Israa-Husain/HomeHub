name: homehub

#Shared application settings.
x-app-environment: &app-environment
  DB_URL: "${DB_URL:?Set DB_URL in .env}"
  DB_USERNAME: "${DB_USERNAME:?Set DB_USERNAME in .env}"
  DB_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD in .env}"
  JWT_SECRET: "${JWT_SECRET:?Set JWT_SECRET in .env}"
  INTERNAL_API_KEY: "${INTERNAL_API_KEY:?Set INTERNAL_API_KEY in .env}"

  SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092

  SPRING_JPA_HIBERNATE_DDL_AUTO: validate
  SPRING_SQL_INIT_MODE: never
  SPRING_FLYWAY_ENABLED: "false"

  HOMEHUB_SEED_ENABLED: "false"
  HOMEHUB_DEMO_ENABLED: "false"
  HOMEHUB_EVENTS_TOPIC: homehub.notifications.v1
  HOMEHUB_CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:5173}"

services:
  kafka:
    image: apache/kafka:4.1.2
    restart: unless-stopped

    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3

      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"

    volumes:
      - kafka_data:/var/lib/kafka/data

    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list > /dev/null 2>&1
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s

    networks:
      - backend

  ignite:
    image: apacheignite/ignite:2.17.0
    restart: unless-stopped

    environment:
      JVM_OPTS: "-Xms256m -Xmx512m"

    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - "exec 3<>/dev/tcp/127.0.0.1/10800"
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

    networks:
      - backend

  auth-service:
    image: homehub-auth:local

    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: auth-service

    restart: unless-stopped

    environment:
      <<: *app-environment
      SERVER_PORT: "8081"
      SERVER_ADDRESS: 0.0.0.0
      APP_BASE_URL: http://localhost:8081

    ports:
      - "127.0.0.1:8081:8081"

    volumes:
      - auth_uploads:/app/uploads

    depends_on:
      kafka:
        condition: service_healthy

    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - "exec 3<>/dev/tcp/127.0.0.1/8081"
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

    networks:
      - backend

  booking-service:
    image: homehub-booking:local

    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: booking-service

    restart: unless-stopped

    environment:
      <<: *app-environment
      SERVER_PORT: "8082"
      SERVER_ADDRESS: 0.0.0.0
      AUTH_SERVICE_URL: http://auth-service:8081

      IGNITE_ADDRESS: ignite:10800
      HOMEHUB_CACHE_ENABLED: "true"
      SCHEDULING_ENABLED: "true"

      JAVA_TOOL_OPTIONS: >-
        -Duser.timezone=Asia/Bahrain
        --add-opens=java.base/java.nio=ALL-UNNAMED
        --add-opens=java.base/sun.nio.ch=ALL-UNNAMED

    ports:
      - "127.0.0.1:8082:8082"

    depends_on:
      kafka:
        condition: service_healthy
      ignite:
        condition: service_healthy
      auth-service:
        condition: service_healthy

    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - "exec 3<>/dev/tcp/127.0.0.1/8082"
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

    networks:
      - backend

  notification-service:
    image: homehub-notification:local

    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: notification-service

    restart: unless-stopped

    environment:
      <<: *app-environment
      SERVER_PORT: "8083"
      SERVER_ADDRESS: 0.0.0.0
      AUTH_SERVICE_URL: http://auth-service:8081

      HOMEHUB_EVENTS_DLT: homehub.notifications.v1.DLT
      KAFKA_REPLICATION_FACTOR: "1"
      KAFKA_CONCURRENCY: "1"

      MAIL_ENABLED: "true"
      MAIL_HOST: smtp.gmail.com
      MAIL_PORT: "587"
      MAIL_FROM: "${MAIL_FROM:?Set MAIL_FROM in .env}"
      MAIL_USERNAME: "${MAIL_USERNAME:?Set MAIL_USERNAME in .env}"
      MAIL_PASSWORD: "${MAIL_PASSWORD:?Set MAIL_PASSWORD in .env}"
      MAIL_SMTP_AUTH: "true"
      MAIL_STARTTLS: "true"
      MAIL_TLS_REQUIRED: "true"

    ports:
      - "127.0.0.1:8083:8083"

    depends_on:
      kafka:
        condition: service_healthy
      auth-service:
        condition: service_healthy

    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - "exec 3<>/dev/tcp/127.0.0.1/8083"
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  kafka_data:
  auth_uploads: